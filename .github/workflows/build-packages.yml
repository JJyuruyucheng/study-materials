name: Build install packages

# 只手动触发，避免 main 分支 push 连带触发仓库里其它 iOS/macOS 工作流
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-install-packages
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles nsis
      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $src = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $src.FullName "out/HGhub_1.2.1_x64_setup.exe"
          Get-ChildItem out | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: out/HGhub_1.2.1_x64_setup.exe
          if-no-files-found: error

  android:
    name: Android arm64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK and NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri android init --ci
      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" \
            -alias hghub -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass hghub2026 -keypass hghub2026 \
            -dname "CN=HGhub, OU=Dev, O=Dev, L=NA, S=NA, C=CN"
      - name: Build APK
        run: pnpm tauri android build --apk --target aarch64
      - name: Sign and collect APK
        run: |
          mkdir -p out
          SRC="$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk' | head -1)"
          if [ -z "$SRC" ]; then SRC="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)"; fi
          echo "unsigned: $SRC"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias hghub \
            --ks-pass pass:hghub2026 --key-pass pass:hghub2026 \
            --v4-signing-enabled false \
            --out "out/HGhub_1.2.1_arm64.apk" "$SRC"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify "out/HGhub_1.2.1_arm64.apk"
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/HGhub_1.2.1_arm64.apk
          if-no-files-found: error

  release:
    name: Publish to GitHub Release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Check packages
        run: ls -lh packages
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: packages-1.2.1
          name: "HGhub 1.2.1 安装包"
          body: |
            - `HGhub_1.2.1_x64_setup.exe`：Windows x64 NSIS 安装程序
            - `HGhub_1.2.1_arm64.apk`：Android 通用手机包（arm64-v8a，自签名，安装时需允许未知来源）

            基于本仓库源码由 GitHub Actions 云端构建。仅供个人学习与技术交流；
            许可证 PolyForm Noncommercial 1.0.0，禁止任何商业用途。
          draft: false
          prerelease: false
          files: |
            packages/HGhub_1.2.1_x64_setup.exe
            packages/HGhub_1.2.1_arm64.apk
